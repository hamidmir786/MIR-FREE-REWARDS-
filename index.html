<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MIR FREE REWARDS</title>
    <meta name="google-site-verification" content="QMjphaXKhK0yORDOAM-Wfbrh5AyeSk1loKRCU3uBQ4k" />
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body, html {
            width: 100%;
            height: 100%;
            overflow: hidden;
            font-family: Arial, sans-serif;
            background-color: #000;
        }

        /* Full Screen Container */
        .welcome-screen {
            width: 100vw;
            height: 100vh;
            display: flex;
            flex-direction: column;
            background-color: #000;
        }

        /* Image Wrapper - Takes top area and resizes image safely */
        .image-wrapper {
            flex: 1;
            width: 100%;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 10px;
            overflow: hidden;
        }

        /* Responsive Image */
        .bg-image {
            max-width: 100%;
            max-height: 100%;
            object-fit: contain;
            border-radius: 8px;
        }

        /* Dedicated Bottom Bar raised slightly for better visibility */
        .button-container {
            width: 100%;
            background-color: #000;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 15px 25px 35px 25px; /* Bottom padding increased so button moves UP */
            border-top: 1px solid #1a1a1a;
            z-index: 10;
        }

        /* Text above the button */
        .process-title {
            color: #ffffff;
            font-size: 18px;
            font-weight: bold;
            margin-bottom: 12px;
            text-transform: uppercase;
            letter-spacing: 1px;
            text-align: center;
        }

        /* Full-width Single CONTINUE Button */
        .btn-continue {
            width: 100%;
            max-width: 320px;
            padding: 14px 20px;
            font-size: 16px;
            font-weight: bold;
            text-transform: uppercase;
            border: 2px solid #00d2ff;
            border-radius: 25px;
            cursor: pointer;
            text-decoration: none;
            transition: all 0.3s ease;
            box-shadow: 0 4px 15px rgba(0, 210, 255, 0.3);
            background-color: rgba(0, 210, 255, 0.15);
            color: #00d2ff;
            text-align: center;
            display: block;
        }

        .btn-continue:hover {
            background-color: #00d2ff;
            color: #000;
        }
    </style>
</head>
<body>

    <div class="welcome-screen">
        <!-- Main Image -->
        <div class="image-wrapper">
            <img src="https://i.ibb.co/fVtYcHsR/1785921594929.png" alt="Mir Free Rewards" class="bg-image">
        </div>

        <!-- Raised Bottom Bar with Text and Single Button -->
        <div class="button-container">
            <div class="process-title">Continue To Process</div>
            <a href="login.html" class="btn-continue">CONTINUE</a>
        </div>
    </div>

</body>
</html>
