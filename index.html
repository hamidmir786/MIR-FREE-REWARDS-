<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MIR FREE REWARDS</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body, html {
            width: 100%;
            height: 100%;
            overflow: hidden;
            font-family: Arial, sans-serif;
            background-color: #000;
        }

        /* Screen Wrapper */
        .welcome-screen {
            position: relative;
            width: 100vw;
            height: 100vh;
            display: flex;
            flex-direction: column;
            justify-content: flex-end;
            align-items: center;
        }

        /* Responsive Background Image */
        .bg-image {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            object-fit: cover;
            object-position: center;
            z-index: 1;
        }

        /* Button Container at Bottom */
        .button-container {
            position: relative;
            z-index: 2;
            width: 100%;
            padding: 20px 25px 40px 25px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            background: linear-gradient(to top, rgba(0, 0, 0, 0.85), transparent);
        }

        /* Buttons Styling */
        .btn {
            padding: 12px 28px;
            font-size: 16px;
            font-weight: bold;
            text-transform: uppercase;
            border: 2px solid;
            border-radius: 25px;
            cursor: pointer;
            text-decoration: none;
            transition: all 0.3s ease;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.5);
        }

        /* EXIT Button (Left Side) */
        .btn-exit {
            background-color: rgba(255, 0, 0, 0.2);
            color: #ff4d4d;
            border-color: #ff4d4d;
        }

        .btn-exit:hover {
            background-color: #ff4d4d;
            color: #fff;
        }

        /* CONTINUE Button (Right Side) */
        .btn-continue {
            background-color: rgba(0, 210, 255, 0.2);
            color: #00d2ff;
            border-color: #00d2ff;
        }

        .btn-continue:hover {
            background-color: #00d2ff;
            color: #000;
        }
    </style>
</head>
<body>

    <div class="welcome-screen">
        <img src="https://i.ibb.co/fVtYcHsR/1785921594929.png" alt="1785921594929" class="bg-image">

        <div class="button-container">
            <button class="btn btn-exit" onclick="exitApp()">EXIT</button>
            <a href="login.html" class="btn btn-continue">CONTINUE</a>
        </div>
    </div>

    <script>
        // Exit Functionality for Web and Mobile WebView
        function exitApp() {
            if (navigator.app && navigator.app.exitApp) {
                navigator.app.exitApp(); // For Android WebView/Cordova
            } else {
                window.close(); // For standard Web Browsers
            }
        }
    </script>

</body>
</html>
