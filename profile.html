<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>My Profile - MIR FREE REWARDS</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <!-- Firebase Libraries -->
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-auth.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-firestore.js"></script>

    <style>
        body { 
            background-color: #09070f; 
            color: #f3f4f6; 
            font-family: 'Segoe UI', system-ui, -apple-system, sans-serif; 
        }
        .premium-panel { 
            background: rgba(19, 15, 36, 0.95); 
            border: 1px solid rgba(168, 85, 247, 0.2); 
        }
        .menu-card {
            background: rgba(23, 19, 44, 0.8);
            border: 1px solid rgba(168, 85, 247, 0.15);
        }
        .icon-box {
            width: 40px;
            height: 40px;
            display: flex;
            align-items: center;
            justify-content: center;
            border-radius: 12px;
        }
    </style>
</head>
<body class="p-4 flex flex-col min-h-screen justify-between pb-10">

    <div class="max-w-md mx-auto w-full space-y-5">
        
        <!-- HEADER NAV -->
        <div class="flex items-center justify-between p-3 rounded-2xl premium-panel shadow-lg">
            <a href="homepage.html" class="px-3 py-1.5 bg-purple-950/60 border border-purple-800/40 rounded-xl text-purple-300 text-xs font-bold flex items-center gap-2">
                <i class="fa-solid fa-arrow-left"></i> Home
            </a>
            <h1 class="text-xs font-black uppercase tracking-widest text-purple-400">My Profile</h1>
            <div class="w-16"></div> <!-- Spacer for symmetry -->
        </div>

        <!-- USER PROFILE CARD -->
        <div class="p-6 rounded-3xl premium-panel text-center space-y-3 shadow-2xl relative overflow-hidden">
            <!-- Dynamic Email First Letter Avatar Ring -->
            <div class="relative w-20 h-20 mx-auto">
                <div class="w-full h-full rounded-full bg-gradient-to-tr from-purple-600 via-indigo-500 to-pink-500 p-1 flex items-center justify-center shadow-lg shadow-purple-900/50">
                    <div class="w-full h-full bg-slate-950 rounded-full flex items-center justify-center border border-purple-500/30">
                        <span id="userInitial" class="text-3xl font-black text-transparent bg-clip-text bg-gradient-to-r from-purple-400 to-pink-400 uppercase">U</span>
                    </div>
                </div>
            </div>

            <!-- User Info -->
            <div class="space-y-1">
                <h2 id="userName" class="text-base font-black text-white tracking-wide">Loading...</h2>
                <p id="userEmail" class="text-xs text-purple-300/80 font-medium">user@gmail.com</p>
            </div>

            <!-- User UID Pill -->
            <div class="pt-1 flex items-center justify-center">
                <div class="inline-flex items-center gap-2 bg-black/60 px-3.5 py-1.5 rounded-xl border border-purple-900/50 font-mono text-[11px] text-gray-400">
                    <span>UID: <span id="userUid" class="text-purple-300">...</span></span>
                    <button onclick="copyUid()" class="text-purple-400 hover:text-purple-200 active:scale-90 transition-transform">
                        <i class="fa-regular fa-copy"></i>
                    </button>
                </div>
            </div>
        </div>

        <!-- GENERAL MENU SECTION -->
        <div class="space-y-2">
            <h3 class="text-[11px] font-black uppercase tracking-widest text-gray-400 px-2">General</h3>

            <div class="menu-card rounded-3xl p-2 space-y-1 shadow-xl">
                
                <!-- 1. About Us -->
                <a href="about.html" class="flex items-center justify-between p-3 rounded-2xl hover:bg-purple-900/20 transition-all">
                    <div class="flex items-center gap-3.5">
                        <div class="icon-box bg-purple-500/10 text-purple-400 border border-purple-500/20">
                            <i class="fa-solid fa-circle-info text-sm"></i>
                        </div>
                        <span class="text-xs font-bold text-gray-100">About Us</span>
                    </div>
                    <i class="fa-solid fa-chevron-right text-xs text-gray-500"></i>
                </a>

                <div class="h-[1px] bg-purple-900/20 mx-3"></div>

                <!-- 2. Contact Us -->
                <a href="contact.html" class="flex items-center justify-between p-3 rounded-2xl hover:bg-purple-900/20 transition-all">
                    <div class="flex items-center gap-3.5">
                        <div class="icon-box bg-indigo-500/10 text-indigo-400 border border-indigo-500/20">
                            <i class="fa-solid fa-comment-dots text-sm"></i>
                        </div>
                        <span class="text-xs font-bold text-gray-100">Contact Us</span>
                    </div>
                    <i class="fa-solid fa-chevron-right text-xs text-gray-500"></i>
                </a>

                <div class="h-[1px] bg-purple-900/20 mx-3"></div>

                <!-- 3. FAQs -->
                <a href="faq.html" class="flex items-center justify-between p-3 rounded-2xl hover:bg-purple-900/20 transition-all">
                    <div class="flex items-center gap-3.5">
                        <div class="icon-box bg-sky-500/10 text-sky-400 border border-sky-500/20">
                            <i class="fa-solid fa-circle-question text-sm"></i>
                        </div>
                        <span class="text-xs font-bold text-gray-100">FAQs</span>
                    </div>
                    <i class="fa-solid fa-chevron-right text-xs text-gray-500"></i>
                </a>

                <div class="h-[1px] bg-purple-900/20 mx-3"></div>

                <!-- 4. Terms and Conditions -->
                <a href="terms.html" class="flex items-center justify-between p-3 rounded-2xl hover:bg-purple-900/20 transition-all">
                    <div class="flex items-center gap-3.5">
                        <div class="icon-box bg-blue-500/10 text-blue-400 border border-blue-500/20">
                            <i class="fa-solid fa-file-contract text-sm"></i>
                        </div>
                        <span class="text-xs font-bold text-gray-100">Terms and Conditions</span>
                    </div>
                    <i class="fa-solid fa-chevron-right text-xs text-gray-500"></i>
                </a>

                <div class="h-[1px] bg-purple-900/20 mx-3"></div>

                <!-- 5. Privacy Policy -->
                <a href="privacy.html" class="flex items-center justify-between p-3 rounded-2xl hover:bg-purple-900/20 transition-all">
                    <div class="flex items-center gap-3.5">
                        <div class="icon-box bg-emerald-500/10 text-emerald-400 border border-emerald-500/20">
                            <i class="fa-solid fa-shield-halved text-sm"></i>
                        </div>
                        <span class="text-xs font-bold text-gray-100">Privacy Policy</span>
                    </div>
                    <i class="fa-solid fa-chevron-right text-xs text-gray-500"></i>
                </a>

                <div class="h-[1px] bg-purple-900/20 mx-3"></div>

                <!-- 6. History -->
                <a href="history.html" class="flex items-center justify-between p-3 rounded-2xl hover:bg-purple-900/20 transition-all">
                    <div class="flex items-center gap-3.5">
                        <div class="icon-box bg-amber-500/10 text-amber-400 border border-amber-500/20">
                            <i class="fa-solid fa-clock-rotate-left text-sm"></i>
                        </div>
                        <span class="text-xs font-bold text-gray-100">History</span>
                    </div>
                    <i class="fa-solid fa-chevron-right text-xs text-gray-500"></i>
                </a>

                <div class="h-[1px] bg-purple-900/20 mx-3"></div>

                <!-- 7. Log Out -->
                <button onclick="logoutUser()" class="w-full flex items-center justify-between p-3 rounded-2xl hover:bg-red-950/30 transition-all text-left">
                    <div class="flex items-center gap-3.5">
                        <div class="icon-box bg-red-500/10 text-red-400 border border-red-500/20">
                            <i class="fa-solid fa-right-from-bracket text-sm"></i>
                        </div>
                        <span class="text-xs font-bold text-red-400">Log Out</span>
                    </div>
                    <i class="fa-solid fa-chevron-right text-xs text-red-500/60"></i>
                </button>

            </div>
        </div>

    </div>

    <script>
        const firebaseConfig = {
          apiKey: "AIzaSyD0AZG6D8H-OZOJK0s5sDyVJ6BLJJKVszc",
          authDomain: "mir-free-rewards-log-and-earn.firebaseapp.com",
          databaseURL: "https://mir-free-rewards-log-and-earn-default-rtdb.firebaseio.com",
          projectId: "mir-free-rewards-log-and-earn",
          storageBucket: "mir-free-rewards-log-and-earn.firebasestorage.app",
          messagingSenderId: "1055267295995",
          appId: "1:1055267295995:web:35ebcfaa35a650a832165e"
        };

        if (!firebase.apps.length) firebase.initializeApp(firebaseConfig);
        const auth = firebase.auth(), db = firebase.firestore();

        let currentUid = "";

        // Check Auth & Load User Profile Details
        auth.onAuthStateChanged((user) => {
            if (user) {
                currentUid = user.uid;
                const emailStr = user.email || "";
                document.getElementById("userEmail").innerText = emailStr || "No Email";
                document.getElementById("userUid").innerText = user.uid;

                // Load Name from Firestore Database
                db.collection("users").doc(user.uid).get().then((doc) => {
                    let displayName = "User";
                    if (doc.exists && doc.data().name) {
                        displayName = doc.data().name;
                    } else if (user.displayName) {
                        displayName = user.displayName;
                    }
                    
                    document.getElementById("userName").innerText = displayName;

                    // Set First Letter Logo (Name/Email Initial)
                    const initial = (displayName.charAt(0) || emailStr.charAt(0) || "U").toUpperCase();
                    document.getElementById("userInitial").innerText = initial;

                }).catch((err) => {
                    console.error("Error fetching profile name:", err);
                    const initial = (emailStr.charAt(0) || "U").toUpperCase();
                    document.getElementById("userInitial").innerText = initial;
                    document.getElementById("userName").innerText = user.displayName || "User";
                });
            } else {
                // Not logged in -> Redirect to login
                window.location.href = "login.html";
            }
        });

        // Copy UID Function
        function copyUid() {
            if (!currentUid) return;
            navigator.clipboard.writeText(currentUid).then(() => {
                alert("📋 UID Copied to Clipboard!");
            }).catch(err => {
                console.error("Failed to copy UID: ", err);
            });
        }

        // Logout Function
        function logoutUser() {
            if (confirm("Are you sure you want to log out?")) {
                auth.signOut().then(() => {
                    window.location.href = "login.html";
                }).catch((error) => {
                    alert("Logout Error: " + error.message);
                });
            }
        }
    </script>
</body>
</html>
