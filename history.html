<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>MIR FREE REWARDS - History Log</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-auth.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-firestore.js"></script>

    <style>
        body { background-color: #09070f; color: #f3f4f6; font-family: 'Segoe UI', system-ui, sans-serif; overflow-x: hidden; }
        .premium-panel { background: rgba(19, 15, 36, 0.85); border: 1px solid rgba(147, 51, 234, 0.15); }
        .tab-btn-active { background: linear-gradient(135deg, #7c3aed 0%, #6d28d9 100%); color: #ffffff; border: 1px solid rgba(167, 139, 250, 0.4); box-shadow: 0 0 15px rgba(124, 58, 237, 0.4); }
        .tab-btn-inactive { background: rgba(19, 15, 36, 0.6); color: #9ca3af; border: 1px solid rgba(255, 255, 255, 0.05); }
        .app-container { width: 100%; max-width: 480px; margin: 0 auto; padding-bottom: 90px; }
        .badge-active { background: rgba(16, 185, 129, 0.2); color: #10b981; border: 1px solid rgba(16, 185, 129, 0.4); }
        .badge-pending { background: rgba(107, 114, 128, 0.2); color: #9ca3af; border: 1px solid rgba(107, 114, 128, 0.3); }
    </style>
</head>
<body class="p-3 select-none">

    <div class="app-container space-y-4">
        
        <!-- HEADER -->
        <div class="w-full p-4 rounded-2xl premium-panel flex justify-between items-center shadow-2xl">
            <div class="flex items-center gap-3">
                <a href="profile.html" class="w-8 h-8 rounded-xl bg-purple-900/40 border border-purple-500/30 flex items-center justify-center text-purple-300">
                    <i class="fa-solid fa-arrow-left text-sm"></i>
                </a>
                <div>
                    <h2 class="text-sm font-black text-white uppercase tracking-wider flex items-center gap-1.5">
                        <i class="fa-solid fa-clock-rotate-left text-purple-400"></i> History Log
                    </h2>
                    <p class="text-[9px] text-purple-400">Track earnings & referrals</p>
                </div>
            </div>
            <div class="px-3 py-1 rounded-xl bg-black/50 border border-amber-500/30 flex items-center gap-1.5">
                <i class="fa-solid fa-coins text-amber-400 text-xs"></i>
                <span id="coinCounter" class="text-xs font-black text-amber-300">0</span>
            </div>
        </div>

        <!-- NAVIGATION TABS -->
        <div class="grid grid-cols-2 gap-2 p-1 bg-black/40 rounded-2xl border border-purple-900/40">
            <button id="coinsTabBtn" onclick="switchTab('coins')" class="py-2.5 rounded-xl text-xs font-black uppercase tracking-wider flex items-center justify-center gap-2 transition-all tab-btn-active">
                <i class="fa-solid fa-coins text-xs"></i> Coins History
            </button>
            <button id="referTabBtn" onclick="switchTab('refer')" class="py-2.5 rounded-xl text-xs font-black uppercase tracking-wider flex items-center justify-center gap-2 transition-all tab-btn-inactive">
                <i class="fa-solid fa-users text-xs"></i> Refer History
            </button>
        </div>

        <!-- TAB CONTENT CONTAINER -->
        <div class="w-full p-4 rounded-2xl bg-black/40 border border-gray-900 min-h-[300px]">
            
            <!-- COINS HISTORY SECTION -->
            <div id="coinsHistorySection" class="space-y-3">
                <div id="coinsList" class="space-y-2">
                    <div class="flex flex-col items-center justify-center py-16 text-center text-gray-500 space-y-2">
                        <i class="fa-solid fa-spinner fa-spin text-2xl text-purple-500"></i>
                        <p class="text-xs font-bold">Loading history...</p>
                    </div>
                </div>
            </div>

            <!-- REFERRAL HISTORY SECTION -->
            <div id="referHistorySection" class="space-y-3 hidden">
                <div class="flex justify-between items-center pb-2 border-b border-gray-900">
                    <span class="text-[10px] font-bold uppercase tracking-wider text-purple-400">Referred Users</span>
                    <span id="totalReferralsBadge" class="text-[9px] bg-purple-950 text-purple-300 px-2 py-0.5 rounded-full border border-purple-800/40 font-mono font-bold">0 Users</span>
                </div>
                
                <div id="referralsList" class="space-y-2.5 max-h-[380px] overflow-y-auto pr-1">
                    <div class="flex flex-col items-center justify-center py-16 text-center text-gray-500 space-y-2">
                        <i class="fa-solid fa-users-slash text-3xl opacity-30"></i>
                        <p class="text-xs font-bold">No Referral History Found</p>
                    </div>
                </div>
            </div>

        </div>

    </div>

    <!-- NAVIGATION BAR -->
    <nav class="fixed bottom-0 left-0 right-0 z-50 p-2.5 bg-[#06040a]/95 backdrop-blur-md border-t border-white/5 flex justify-around items-center">
        <a href="homepage.html" class="flex flex-col items-center gap-0.5 text-gray-500 hover:text-purple-400 transition-colors"><i class="fa-solid fa-house text-sm"></i><span class="text-[8px] font-black uppercase tracking-wider">Home</span></a>
        <a href="refer.html" class="flex flex-col items-center gap-0.5 text-gray-500 hover:text-purple-400 transition-colors"><i class="fa-solid fa-user-plus text-sm"></i><span class="text-[8px] font-black uppercase tracking-wider">Refer</span></a>
        <a href="withdrawal.html" class="flex flex-col items-center gap-0.5 text-gray-500 hover:text-purple-400 transition-colors"><i class="fa-solid fa-wallet text-sm"></i><span class="text-[8px] font-black uppercase tracking-wider">Withdraw</span></a>
        <a href="leaderboard.html" class="flex flex-col items-center gap-0.5 text-gray-500 hover:text-purple-400 transition-colors"><i class="fa-solid fa-trophy text-sm"></i><span class="text-[8px] font-black uppercase tracking-wider">Ranks</span></a>
        <a href="profile.html" class="flex flex-col items-center gap-0.5 text-purple-400 font-bold"><i class="fa-solid fa-gears text-sm"></i><span class="text-[8px] font-black uppercase tracking-wider">Profile</span></a>
    </nav>

    <script>
        const firebaseConfig = {
          apiKey: "AIzaSyD0AZG6D8H-OZOJK0s5sDyVJ6BLJJKVszc",
          authDomain: "mir-free-rewards-log-and-earn.firebaseapp.com",
          databaseURL: "https://mir-free-rewards-log-and-earn-default-rtdb.firebaseio.com",
          projectId: "mir-free-rewards-log-and-earn",
          storageBucket: "mir-free-rewards-log-and-earn.firebasestorage.app",
          messagingSenderId: "1055267295995",
          appId: "1:1055267295995:web:35ebcfaa35a650a832165e"
        };

        if (!firebase.apps.length) firebase.initializeApp(firebaseConfig);
        const auth = firebase.auth(), db = firebase.firestore();

        let uid = null;

        auth.onAuthStateChanged((user) => {
            if (user) {
                uid = user.uid;
                loadUserData();
                loadCoinsHistory();
                loadReferralHistory();
            } else {
                window.location.href = "login.html";
            }
        });

        function loadUserData() {
            db.collection("users").doc(uid).onSnapshot((doc) => {
                if (doc.exists) {
                    document.getElementById("coinCounter").innerText = doc.data().coins || 0;
                }
            });
        }

        // Tab Switcher Function
        function switchTab(tab) {
            const coinsBtn = document.getElementById("coinsTabBtn");
            const referBtn = document.getElementById("referTabBtn");
            const coinsSec = document.getElementById("coinsHistorySection");
            const referSec = document.getElementById("referHistorySection");

            if (tab === 'coins') {
                coinsBtn.className = "py-2.5 rounded-xl text-xs font-black uppercase tracking-wider flex items-center justify-center gap-2 transition-all tab-btn-active";
                referBtn.className = "py-2.5 rounded-xl text-xs font-black uppercase tracking-wider flex items-center justify-center gap-2 transition-all tab-btn-inactive";
                coinsSec.classList.remove("hidden");
                referSec.classList.add("hidden");
            } else {
                referBtn.className = "py-2.5 rounded-xl text-xs font-black uppercase tracking-wider flex items-center justify-center gap-2 transition-all tab-btn-active";
                coinsBtn.className = "py-2.5 rounded-xl text-xs font-black uppercase tracking-wider flex items-center justify-center gap-2 transition-all tab-btn-inactive";
                referSec.classList.remove("hidden");
                coinsSec.classList.add("hidden");
            }
        }

        // Fetch Coins History (Using the exact collection used across all pages: coin_history)
        function loadCoinsHistory() {
            const coinsList = document.getElementById("coinsList");
            
            db.collection("users").doc(uid).collection("coin_history")
              .orderBy("timestamp", "desc")
              .onSnapshot((snapshot) => {
                  if (snapshot.empty) {
                      coinsList.innerHTML = `
                          <div class="flex flex-col items-center justify-center py-16 text-center text-gray-500 space-y-2">
                              <i class="fa-solid fa-receipt text-3xl opacity-30"></i>
                              <p class="text-xs font-bold">No Transaction History Found</p>
                          </div>`;
                      return;
                  }

                  let html = "";
                  snapshot.forEach((doc) => {
                      const item = doc.data();
                      
                      let formattedTime = "Recent";
                      if (item.timestamp) {
                          const dateObj = item.timestamp.toDate ? item.timestamp.toDate() : new Date(item.timestamp);
                          formattedTime = dateObj.toLocaleString('en-GB', {
                              day: '2-digit', month: '2-digit', year: 'numeric',
                              hour: '2-digit', minute: '2-digit', hour12: false
                          });
                      }

                      const isCredit = item.type === "credit";
                      const amountVal = item.amount || 0;
                      const titleText = item.title || 'Coins Activity';

                      html += `
                          <div class="p-3 rounded-xl bg-black/60 border border-purple-900/30 flex justify-between items-center">
                              <div class="flex items-center gap-3">
                                  <div class="w-8 h-8 rounded-lg bg-purple-950 border border-purple-800/40 flex items-center justify-center text-purple-400">
                                      <i class="${isCredit ? 'fa-solid fa-coins text-amber-400' : 'fa-solid fa-receipt text-red-400'} text-xs"></i>
                                  </div>
                                  <div>
                                      <p class="text-xs font-bold text-white">${titleText}</p>
                                      <p class="text-[9px] text-gray-500 font-mono">${formattedTime}</p>
                                  </div>
                              </div>
                              <span class="text-xs font-black ${isCredit ? 'text-emerald-400' : 'text-red-400'} font-mono">
                                  ${isCredit ? '+' : '-'}${amountVal} Coins
                              </span>
                          </div>
                      `;
                  });
                  coinsList.innerHTML = html;
              }, (error) => {
                  console.error("History fetch error: ", error);
                  coinsList.innerHTML = `
                      <div class="flex flex-col items-center justify-center py-16 text-center text-gray-500 space-y-2">
                          <i class="fa-solid fa-receipt text-3xl opacity-30"></i>
                          <p class="text-xs font-bold">No Transaction History Found</p>
                      </div>`;
              });
        }

        // Fetch Referral History & Check-In Tracking
        function loadReferralHistory() {
            const referralsList = document.getElementById("referralsList");

            db.collection("users")
              .where("referredBy", "==", uid)
              .onSnapshot((querySnapshot) => {
                  document.getElementById("totalReferralsBadge").innerText = `${querySnapshot.size} Users`;

                  if (querySnapshot.empty) {
                      referralsList.innerHTML = `
                          <div class="flex flex-col items-center justify-center py-16 text-center text-gray-500 space-y-2">
                              <i class="fa-solid fa-users-slash text-3xl opacity-30"></i>
                              <p class="text-xs font-bold">No Referral History Found</p>
                          </div>`;
                      return;
                  }

                  let html = "";
                  querySnapshot.forEach((doc) => {
                      const refUser = doc.data();
                      const checkInDays = refUser.checkInStreak || 0;
                      const day1Done = checkInDays >= 1;
                      const day2Done = checkInDays >= 2;
                      const day3Done = checkInDays >= 3;

                      html += `
                          <div class="p-2.5 rounded-xl bg-black/60 border border-purple-900/40 space-y-2">
                              <div class="flex justify-between items-center">
                                  <div class="flex items-center gap-2">
                                      <div class="w-6 h-6 rounded-full bg-purple-900/50 border border-purple-500/40 flex items-center justify-center text-[10px] text-purple-300 font-bold">
                                          ${(refUser.name || "U").charAt(0).toUpperCase()}
                                      </div>
                                      <div>
                                          <p class="text-[10px] font-bold text-white">${refUser.name || 'User'}</p>
                                          <p class="text-[8px] text-gray-500 font-mono">${refUser.email ? refUser.email.substring(0, 4) + '***' : 'User'}</p>
                                      </div>
                                  </div>
                                  <span class="text-[8px] font-mono px-2 py-0.5 rounded ${day3Done ? 'badge-active' : 'badge-pending'}">
                                      ${day3Done ? '✓ Completed (50 Leaderboard Pts)' : 'In Progress'}
                                  </span>
                              </div>

                              <div class="grid grid-cols-3 gap-1.5 text-center text-[8px] font-mono pt-1 border-t border-white/5">
                                  <div class="p-1 rounded ${day1Done ? 'bg-emerald-950/60 text-emerald-400 border border-emerald-800/40' : 'bg-gray-900/50 text-gray-500'}">
                                      <span>Day 1</span> ${day1Done ? '✓' : '⏳'}
                                  </div>
                                  <div class="p-1 rounded ${day2Done ? 'bg-emerald-950/60 text-emerald-400 border border-emerald-800/40' : 'bg-gray-900/50 text-gray-500'}">
                                      <span>Day 2</span> ${day2Done ? '✓' : '⏳'}
                                  </div>
                                  <div class="p-1 rounded ${day3Done ? 'bg-indigo-950/60 text-indigo-300 border border-indigo-800/40 font-bold' : 'bg-gray-900/50 text-gray-500'}">
                                      <span>Day 3</span> ${day3Done ? '🏆 (+50 Pts)' : '⏳'}
                                  </div>
                              </div>
                          </div>
                      `;
                  });
                  referralsList.innerHTML = html;
              });
        }
    </script>
</body>
</html>
